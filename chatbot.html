<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant | AI Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .chat-container { height: calc(100vh - 200px); }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <nav class="p-6 border-b border-slate-200 glass sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="index.html" class="font-bold flex items-center gap-2">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
            <span class="font-bold">AI Business Assistant</span>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4 mt-8">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
            <div id="chat-box" class="chat-container overflow-y-auto p-6 space-y-4">
                <div class="flex gap-3">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-robot text-white text-xs"></i>
                    </div>
                    <div class="bg-slate-100 p-4 rounded-2xl rounded-tl-none max-w-[80%]">
                        Hello! I'm your AI Business Assistant. How can I help you automate your business today?
                    </div>
                </div>
            </div>

            <div class="p-4 border-t border-slate-100 bg-slate-50">
                <form id="chat-form" class="flex gap-2">
                    <input type="text" id="user-input" placeholder="Ask about automation, custom bots, or strategy..." class="flex-1 p-4 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600">
                    <button type="submit" class="bg-blue-600 text-white p-4 rounded-xl hover:scale-105 transition">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script>
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');

        function addMessage(text, isUser = false) {
            const div = document.createElement('div');
            div.className = isUser ? 'flex gap-3 flex-row-reverse' : 'flex gap-3';
            
            div.innerHTML = `
                <div class="w-8 h-8 ${isUser ? 'bg-slate-900' : 'bg-blue-600'} rounded-lg flex items-center justify-center flex-shrink-0">
                    <i class="fas ${isUser ? 'fa-user' : 'fa-robot'} text-white text-xs"></i>
                </div>
                <div class="${isUser ? 'bg-blue-600 text-white' : 'bg-slate-100'} p-4 rounded-2xl ${isUser ? 'rounded-tr-none' : 'rounded-tl-none'} max-w-[80%]">
                    ${text}
                </div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, true);
            userInput.value = '';
            
            // Add loading indicator
            const loadingId = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.id = loadingId;
            loadingDiv.className = 'flex gap-3';
            loadingDiv.innerHTML = `
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-robot text-white text-xs"></i>
                </div>
                <div class="bg-slate-100 p-4 rounded-2xl rounded-tl-none max-w-[80%] text-slate-500 italic">
                    AI is typing...
                </div>
            `;
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: text })
                });
                
                const data = await response.json();
                
                // Remove loading indicator
                document.getElementById(loadingId).remove();
                
                if (data.error) {
                    addMessage("Sorry, I encountered an error: " + data.error);
                } else {
                    addMessage(data.response);
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                addMessage("Sorry, there was a network error. Please ensure the server is running.");
            }
        });
    </script>
</body>
</html>
